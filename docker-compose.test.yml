services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tidekeep
      POSTGRES_PASSWORD: tidekeep
      POSTGRES_DB: ashenveil_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidekeep -d ashenveil_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  rspec:
    image: ruby:4.0.3-slim
    working_dir: /rails
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: tidekeep
      POSTGRES_PASSWORD: tidekeep
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq build-essential libpq-dev libyaml-dev git postgresql-client > /dev/null
        bundle install --quiet
        bundle exec rails db:prepare
        bundle exec rspec $${RSPEC_ARGS:-spec/services/game/world/gather_fishing_mail_spec.rb}

volumes:
  bundle_cache:
