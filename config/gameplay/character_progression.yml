# Neverlands character progression table.
#
# Source: http://wiki.neverlands.ru/wiki/Таблица_опыта
# Retrieved: 2026-07-27 over plain HTTP.
#
# Each row describes the character's current level. `experience_to_next_level`
# is the cumulative combat-experience threshold for reaching the next level.
# Point and currency values are granted when that row's level is reached. The
# fight-experience and NPC columns are current-level caps; level 0 defines the
# source-backed starter state.

