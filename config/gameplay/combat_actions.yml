# Action point penalties for multiple attacks
attack_penalties:
  - attacks: 0
    penalty: 0
  - attacks: 1
    penalty: 0
  - attacks: 2
    penalty: 25
  - attacks: 3
    penalty: 75
  - attacks: 4
    penalty: 150
  - attacks: 5
    penalty: 250

# Default action point budget
defaults:
  action_points_per_turn: 80
