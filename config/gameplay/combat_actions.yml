# Combat action configuration
# Body parts for targeting and blocking

body_parts:
  head:
    key: "head"
    name: "Head"
    damage_multiplier: 1.3
    block_difficulty: 35
  torso:
    key: "torso"
    name: "Torso"
    damage_multiplier: 1.0
    block_difficulty: 30
  stomach:
    key: "stomach"
    name: "Abdomen"
    damage_multiplier: 1.1
    block_difficulty: 30
  legs:
    key: "legs"
    name: "Legs"
    damage_multiplier: 0.9
    block_difficulty: 35

# Attack types
# type 1 = attack, type 2 = block/guard

attack_types:
  # Basic attacks
  simple:
    key: "simple"
    name: "Simple Attack"
    action_cost: 45
    mana_cost: 0
    type: 1
    damage_multiplier: 1.0
    hit_bonus: 0
    description: "Basic physical attack"

  aimed:
    key: "aimed"
    name: "Aimed Attack"
    action_cost: 65
    mana_cost: 0
    type: 1
    damage_multiplier: 1.2
    hit_bonus: 15
    description: "More accurate physical attack"

  spirit_arrow:
    key: "spirit_arrow"
    name: "Spirit Arrow"
    action_cost: 50
    mana_cost: 5
    type: 1
    element: "arcane"
    damage_multiplier: 1.05
    hit_bonus: 5
    description: "Starter magic attack from the Neverlands fight selector"

  mind_blast:
    key: "mind_blast"
    name: "Mind Blast"
    action_cost: 90
    mana_cost: 5
    type: 1
    element: "mind"
    damage_multiplier: 1.35
    hit_bonus: 10
    description: "High-cost starter magic attack from the Neverlands fight selector"

