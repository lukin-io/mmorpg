# Soft-release Ashen Veil airship network.
# Captured Forpost fares stay visible-but-unavailable (no invented Oktal/Telior/Khalgan).
# Playable Ashen triangle: Площадь ↔ Рынок ↔ Верфь with rolling departures.

forpost_khalgan:
  source_zone: Outpost Residential Quarter
  label: Forpost - Khalgan Fair
  route_label: Route Forpost - Khalgan Fair
  fare_nv: 350
forpost_telior:
  source_zone: Outpost Residential Quarter
  label: Forpost - Telior Island
  route_label: Route Forpost - Telior Island
  fare_nv: 150
forpost_oktal:
  source_zone: Outpost Residential Quarter
  label: Forpost - Oktal
  route_label: Route Forpost - Oktal
  fare_nv: 150

# Playable Ashen shuttle: Сгоревший Рынок → Верфь Без Колоколов.
ash_market_to_pier:
  source_zone: "Сгоревший Рынок"
  destination_zone: "Верфь Без Колоколов"
  destination_x: 4
  destination_y: 4
  label: "Рынок → Верфь (челнок Завесы)"
  route_label: "Челнок Пепла: Рынок — Верфь"
  fare_nv: 40
  duration_seconds: 90
  rolling_interval_seconds: 300
  rolling_count: 12
  waypoints:
    - {offset_seconds: 0, zone: "Пепельный Берег", x: 12, y: 10}
    - {offset_seconds: 45, zone: "Пепельный Берег", x: 18, y: 14}
    - {offset_seconds: 90, zone: "Пепельный Берег", x: 24, y: 18}

ash_pier_to_market:
  source_zone: "Верфь Без Колоколов"
  destination_zone: "Сгоревший Рынок"
  destination_x: 4
  destination_y: 4
  label: "Верфь → Рынок (челнок Завесы)"
  route_label: "Челнок Пепла: Верфь — Рынок"
  fare_nv: 40
  duration_seconds: 90
  rolling_interval_seconds: 300
  rolling_count: 12
  waypoints:
    - {offset_seconds: 0, zone: "Пепельный Берег", x: 24, y: 18}
    - {offset_seconds: 45, zone: "Пепельный Берег", x: 18, y: 14}
    - {offset_seconds: 90, zone: "Пепельный Берег", x: 12, y: 10}

