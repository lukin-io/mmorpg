# Ashen sandbox professions / workshop recipes.
# Intentionally authored for playable loop; balance is tunable after playtests.

professions:
  tar_smith:
    title_ru: "Смолокур"
    title_en: "Tar Smith"
    summary_ru: "Плавка смолы и полевые наборы в Смоляной Кузнице."
    summary_en: "Tar work and field kits at the Pitch Forge."
    skill_key: tar_smith
    building_key: workshop

  ash_healer:
    title_ru: "Лекарь Угля"
    title_en: "Ash Healer"
    summary_ru: "Сумки лечения травм в Лазарете Угля."
    summary_en: "Injury healer bags at Coal Infirmary."
    skill_key: ash_healer
    building_key: hospital

  ash_herbalist:
    title_ru: "Травник Пепла"
    title_en: "Ash Herbalist"
    summary_ru: "Часовые настои из трав, грибов, цветов и рыбьего масла."
    summary_en: "One-hour brews from herbs, mushrooms, flowers, and fish oils."
    skill_key: ashen_herbalism
    building_key: hospital

recipes:
  ashen_bandage:
    profession: tar_smith
    title_ru: "Пепельный бинт"
    title_en: "Ashen Bandage"
    summary_ru: "Смола сосны (или щепа) + хвост клеща → бинт (+40 HP, снимает лёгкие травмы)."
    summary_en: "Pine resin (or chips) + mite tail → bandage (+40 HP, clears light injuries)."
    inputs:
      pine_resin: 1
      rat_tail: 1
    output:
      item_key: ashen_bandage
      quantity: 1
    skill_gain: 1
    min_skill: 0

  ashen_bandage_chips:
    profession: tar_smith
    title_ru: "Пепельный бинт (щепа)"
    title_en: "Ashen Bandage (chips)"
    summary_ru: "Запасной рецепт: 2 щепы + хвост, если нет смолы сосны."
    summary_en: "Fallback: 2 chips + tail when pine resin is missing."
    inputs:
      wood_chips: 2
      rat_tail: 1
    output:
      item_key: ashen_bandage
      quantity: 1
    skill_gain: 1
    min_skill: 0

  veil_field_kit:
    profession: tar_smith
    title_ru: "Полевой набор Завесы"
    title_en: "Veil Field Kit"
    summary_ru: "2 бинта + приманка + доска дуба → набор (+80 HP)."
    summary_en: "2 bandages + bait + oak plank → field kit (+80 HP)."
    inputs:
      ashen_bandage: 2
      ashen_bait: 1
      ash_oak_plank: 1
    output:
      item_key: veil_field_kit
      quantity: 1
    skill_gain: 2
    min_skill: 3

  tar_lure_pack:
