    title_en: "Tar Lure Pack"
    summary_ru: "3 приманки + сок берёзы → 5 приманок."
    summary_en: "3 bait + birch sap → 5 bait."
    inputs:
      ashen_bait: 3
      soot_birch_sap: 1
    output:
