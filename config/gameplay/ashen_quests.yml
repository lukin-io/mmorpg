    dialogue_accept_ru: "«Смола жжёт, но держит жизнь. Принесите первый бинт — доказательство, что кузня вас приняла.»"
    dialogue_accept_en: "“Tar burns, but it holds life. Bring the first bandage — proof the forge accepted you.”"
    dialogue_complete_ru: "«Чистая работа. Теперь Лазарет откроет сумку новичка.»"
    dialogue_complete_en: "“Clean work. The Infirmary will open the novice bag next.”"
    where_ru: "Смоляная Кузница"
    where_en: "Pitch Forge"
    giver: "Ратуша Угля"
