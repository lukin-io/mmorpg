# Sandbox Ashen Veil starter quests (Пепельная Завеса).
# Lightweight journal progress stored on character.metadata["ashen_quests"].
# requires: list of completed quest keys before accept is allowed.
# unlocks: quest keys auto-accepted after a successful turn-in.
# where_*: short HUD/board hint for where to go next.

quests:
  veil_lure_drill:
    title_ru: "Приманка Завесы"
    title_en: "Veil Lure Drill"
    summary_ru: "Боты сами нападают раз в 5 минут. Чтобы вызвать бой раньше — используйте Приманку Завесы (Осмотр/Вход на клетке с ботом). Победите врага берега или манекен в Зале Помощи и доложите."
    summary_en: "Bots ambush on their own every 5 minutes. To force a fight earlier, use Ashen Bait (Look/Enter on a hostile cell). Defeat a shore foe or the Help Hall mannequin and report."
    dialogue_accept_ru: "Писец Ратуши кивает: «Берег не прощает робких. Возьми приманку — и докажи, что Завеса тебя слышит.»"
    dialogue_accept_en: "The Hall clerk nods: “The shore does not forgive the timid. Take the lure — prove the Veil can hear you.”"
    dialogue_complete_ru: "«Хорошая работа. Пепел не цепляется к тем, кто бьёт первым.» Писец ставит печать."
    dialogue_complete_en: "“Good work. Ash does not cling to those who strike first.” The clerk stamps the ledger."
    where_ru: "Западные ворота → Пепельный Берег · или Арена → Зал Помощи"
    where_en: "West Gate → Ashen Shore · or Arena → Help Hall"
    giver: "Ратуша Угля"
    objective:
      type: kill_npc
      npc_keys: [plague_rat, ash_gate_mite, ash_gate_patrol, ash_shore_scout, wilderness_bandit, wilderness_robber, ash_bell_mite, arena_training_dummy]
      count: 1
    reward:
      experience: 25
      currency_nv: 20
    unlocks: [veil_tail_delivery, ash_first_herbs]
    sort: 1

  ash_first_herbs:
    title_ru: "Первые травы берега"
    title_en: "First Shore Herbs"
    summary_ru: "Соберите 3 «Пепельные травы» на клетках с травой (Осмотр) и сдайте в Ратушу — начало часа собирателя."
    summary_en: "Gather 3 Ash Herbs on herb cells (Look) and turn them in at City Hall — forager hour start."
    dialogue_accept_ru: "«Трава Завесы пахнет сажей. Принесите три пучка — Лазарет не кормит словами.»"
    dialogue_accept_en: "“Veil herbs smell of soot. Bring three bundles — the Infirmary does not feed on words.”"
    dialogue_complete_ru: "«Хватит на отвар. Теперь сети — рыба слышит прилив.»"
    dialogue_complete_en: "“Enough for a brew. Now nets — fish hear the tide.”"
    where_ru: "Берег → клетка с травой → Осмотр → Ратуша"
    where_en: "Shore → herb cell → Look → City Hall"
    giver: "Ратуша Угля"
    requires: [veil_lure_drill]
    objective:
      type: deliver_item
      item_key: ash_herb
      count: 3
    reward:
      experience: 20
      currency_nv: 15
      item_key: ash_herb
    unlocks: [ash_first_catch]
    sort: 2

  ash_first_catch:
    title_ru: "Первый улов"
    title_en: "First Catch"
    summary_ru: "Поймайте 2 «Пепельных окуня» на рыбных клетках (нужна удочка/крючок из стартового набора) и сдайте в Ратушу."
    summary_en: "Catch 2 Ash Perch on fish cells (starter rod/hook) and turn them in at City Hall."
    dialogue_accept_ru: "«Окунь Завесы дёргает леску. Два хвоста — и Смолокур откроет вам щёпу.»"
    dialogue_accept_en: "“Veil perch tug the line. Two tails — and the Tar Smith opens chips to you.”"
    dialogue_complete_ru: "«Свежий улов. Берег кормит тех, кто не боится мокрых рук.»"
    dialogue_complete_en: "“Fresh catch. The shore feeds those who do not fear wet hands.”"
    where_ru: "Берег → рыбная клетка → Рыбалка → Ратуша"
    where_en: "Shore → fish cell → Fish → City Hall"
    giver: "Ратуша Угля"
    requires: [ash_first_herbs]
    objective:
      type: deliver_item
      item_key: ash_perch
      count: 2
    reward:
      experience: 25
      currency_nv: 20
      item_key: wood_chips
    sort: 3

  veil_tail_delivery:
    title_ru: "Хвост Завесы"
    title_en: "Veil Tail Delivery"
    summary_ru: "Добыйте «Хвост Крысы Завесы» с клещей у ворот и сдайте в Ратушу."
    summary_en: "Collect a Veil Rat Tail from gate mites and turn it in at City Hall."
    dialogue_accept_ru: "«Хвост — не трофей, а доказательство. Без него кузнецы не откроют вам смолу.»"
    dialogue_accept_en: "“A tail is not a trophy — it is proof. Without it the smiths will not open the tar to you.”"
    dialogue_complete_ru: "Писец взвешивает хвост: «Завеса отметила вас. Идите к Смолокуру.»"
    dialogue_complete_en: "The clerk weighs the tail: “The Veil marked you. Go to the Tar Smith.”"
    where_ru: "Ворота → бой → Ратуша"
    where_en: "Gate → fight → City Hall"
    giver: "Ратуша Угля"
    requires: [veil_lure_drill]
    objective:
      type: deliver_item
      item_key: rat_tail
      count: 1
    reward:
      experience: 30
      currency_nv: 15
    unlocks: [tar_smith_first_bandage]
    sort: 4

  tar_smith_first_bandage:
    title_ru: "Первый бинт Смолокура"
