  - {key: castle_dusk, name: "Замок Заката", x: 82, y: 18, kind: castle}
  - {key: castle_mire, name: "Замок Топи", x: 18, y: 82, kind: castle}
  - {key: castle_ridge, name: "Замок Хребта", x: 82, y: 82, kind: castle}

