# Soft-release 100×100 playable outdoor atlas (Пепельный Берег).
# Coordinates are absolute outdoor cells. Landmarks are projected as overlays;
# existing painted starter cells keep their cell_art when already present.
# Approach rings give each fortress/dungeon a labeled neighborhood so travel
# is not "empty cell → sudden dungeon".
zone_name: "Пепельный Берег"
origin_x: 0
origin_y: 0
width: 100
height: 100
seed_source: "playable_region_atlas_v2"

fortresses:
  - {key: fort_north_ash, name: "Северная крепость", x: 50, y: 12, kind: fortress}
  - {key: fort_east_veil, name: "Восточная крепость", x: 88, y: 50, kind: fortress}
  - {key: fort_south_ember, name: "Южная крепость", x: 50, y: 88, kind: fortress}
  - {key: fort_west_salt, name: "Западная крепость", x: 12, y: 50, kind: fortress}
  - {key: fort_heart, name: "Сердце Пепла", x: 50, y: 50, kind: fortress}

castles:
