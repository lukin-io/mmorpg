# Source-backed outdoor NPC configuration.
# Captured Neverlands outdoor bot attacks near Outpost Surroundings used
# Plague Rat NPCs and the normal shared fight pipeline.

outpost_surroundings:
  zone_name: "Outpost Surroundings"
  source_map: "m_1001_999"
  # A bootstrap of complete captured groups onto matching atlas cells, not an
  # inferred global distance/difficulty formula. Existing cell edits survive.
  starter_encounters:
    atlas_names:
      plague_rat: "Крысы"
      wilderness_bandit: "Разбойники"
      wilderness_robber: "Грабители"
    profiles:
      - key: forpost_captured_rat_pair
        source_npc_key: plague_rat
      - key: forpost_captured_bandit_groups
        source_npc_key: wilderness_bandit
    # User-reported September 9 cadence; uniform sampling within this interval
    # is a local calibration, not a measured Neverlands distribution.
    passive_delay_source: "user_reported_2026-09-09"
    passive_delay_windows:
      - key: user_reported_five_to_six_minutes
        min_seconds: 300
        max_seconds: 360
  npc_templates:
    - key: wilderness_robber
      name: Robber
      role: hostile
      level: 8
      hp: 270
      xp: 0
      metadata:
        source_name: "Грабитель"
        source_observation: "2026-09-01_wilderness_bandit_group_variation_and_magic"
        source_map: "m_1008_1007"
        max_attacks_per_turn: 2
  npcs:
    - key: plague_rat
      name: Plague Rat
      role: hostile
      level: 4
      x: 7
      y: 7
      hp: 100
      damage: 7
      xp: 35
      metadata:
        source_name: "Plague Rat"
        source_location: "Outpost Surroundings"
        source_observation: "neverlands_live_outdoor_npc_resource"
        source_map: "m_1001_999"
        source_coordinates: [1001, 999]
        encounter_count: 2
        encounter_experience_reward: 35
        combat_profile:
          injected_attack_keys:
            - spirit_arrow
            - mind_blast
          injected_block_keys:
            - magic_shield
            - rainbow_barrier
            - crystal_sphere
        avatar_image: "zombie.png"
      loot:
        - kind: item
          item: rat_tail
          source_name: "Rat Tail"
          # Exact Neverlands probability is not captured. Preserve the prior
          # no-drop behavior until source evidence supplies a value.
          chance: 0.0

    # Source [1008,1007] maps to local [14,15] with the zone's [994,992]
    # coordinate offset. This independent capture is not beside the west gate.
    # Each roster entry is one exact observed output. Replaying these samples
    # is an MVP calibration and does not claim the source's hidden pool or
    # weights.
    - key: wilderness_bandit
      name: Bandit
      role: hostile
      level: 7
      x: 14
      y: 15
      hp: 155
      xp: 0
      metadata:
        source_name: "Разбойник"
        source_location: "Captured wilderness cell"
