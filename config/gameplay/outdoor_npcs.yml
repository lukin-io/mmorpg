        source_map: "m_1008_1007"
        source_coordinates: [1008, 1007]
        source_capture_scope: "independent_encounter_sample"
        source_coordinate_offset: [994, 992]
        max_attacks_per_turn: 2
        encounter_selection_mode: "observed_sample_replay"
        passive_delay_windows:
          - key: "2026-09-01-interval-1"
            min_seconds: 230
            max_seconds: 278
          - key: "2026-09-01-interval-2"
            min_seconds: 127
            max_seconds: 187
        encounter_rosters:
          - key: "2026-09-01-2334"
            trauma_percent: 30
            encounter_experience_reward: 103
            members:
              - npc_key: wilderness_bandit
                level: 7
                hp: 155
              - npc_key: wilderness_bandit
                level: 9
