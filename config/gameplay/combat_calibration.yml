# Local fitted model v1, authorized 2026-09-12. These are not recovered source
# coefficients. Evidence, equations and tolerances: doc/design/features/combat_calibration.md.
version: 1
strength_damage: 1.5
# Wiki links Accuracy to both Dexterity and Luck; the 3:2 split is a local fit
# preserving the former total rating when those stats are equal.
accuracy_dexterity_weight: 3.0
accuracy_luck_weight: 2.0
# Health wiki: approximately +5% hidden armor per 30 Health, from 30 to 150.
# Complete 30-point steps and saturation above 150 are the local interpretation.
health_armor_step: 30
health_armor_maximum: 150
health_armor_bonus_per_step: 0.05
mastery_damage_divisor: 100.0
mastery_ap_divisor: 15.0
dual_weapon_ap_surcharge: 5
penetration_divisor: 200.0
penetration_cap: 0.75
resistance_divisor: 200.0
resistance_cap: 0.75
damage_variance: 0.18
critical_multiplier: 2.0
fatigue_threshold: 50
fatigue_max_penalty: 0.5
artifact_multipliers:
  none: 1.0
  small: 1.1
  medium: 1.2
  large: 1.3
# Local admission fit pending source category details; never inferred from rarity.
arena_rules:
  limited_artifact_max_multiplier: 1.1
npc_families:
  wilderness_ogre: {weapon_damage: 40, damage_multiplier: 2.55, armor_multiplier: 3.0}
  wilderness_bandit: {weapon_damage: 19, damage_multiplier: 1.0, armor_multiplier: 1.0}
  wilderness_robber: {weapon_damage: 23, damage_multiplier: 1.0, armor_multiplier: 1.0}
  wilderness_orc: {weapon_damage: 3, damage_multiplier: 1.0, armor_multiplier: 1.0}
  wilderness_goblin: {weapon_damage: 2, damage_multiplier: 1.0, armor_multiplier: 1.0}
  wilderness_skeleton: {weapon_damage: 5, damage_multiplier: 1.0, armor_multiplier: 1.0}
experience:
  hp_rate: 0.85
  # Live 2026-09-15 Permit victory: 300 credited HP at low trauma -> 570 XP.
  # Winning player-opponent fit only; NPC and PvP-loss anchors retain hp_rate.
  pvp_victory_hp_rate: 1.9
  group_bonus_per_extra_npc: 0.45
  loss_multiplier: 0.1
  # Live 2026-09-14 PvP loss: 194 credited damage, no kill, 177 XP.
  # Keep damage contribution without the NPC-loss discount; approximate, not recovered.
  pvp_loss_multiplier: 1.0
  participation_share: 0.2
  # Monotonic fitted PvP reward risk factor, not recovered source coefficients.
  pvp_trauma_multiplier: {10: 1.0, 30: 1.1, 50: 1.2, 80: 1.35}
loot:
  observation_scale: 100.0
  observation_max_bonus: 1.0
  currency_chance_percent: 12
  potion_chance_percent: 3
  equipment_chance_percent: 1
recovery:
  hp_full_seconds: 600
  mp_full_seconds: 900
  skill_divisor: 100.0
# Conditional on an ordinary injury occurring. Fight trauma controls occurrence,
# not severity. User-directed rarity fit; not measured Neverlands coefficients.
injuries:
  severity_weights: {light: 80, medium: 18, heavy: 2}
