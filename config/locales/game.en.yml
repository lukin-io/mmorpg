      library_lead: "Ashen Veil rules — readable here in the city."
      library_combat_title: "Combat"
      library_combat_body: "Hit, dodge, crit, and block depend on Accuracy, Evasion, Crush, and Fortitude. Crit ×2. Mage scrolls inject Veil Ember / Ash Spark / Salt Lance (mana + element resist)."
      library_bait_title: "Bait and bots"
      library_bait_body: "Without bait, bots on the cell attack on their own every 5 minutes. To force a fight sooner (Look / Enter / Character / Inventory) — buy or take Veil Bait in the shop."
      library_gear_title: "Gear"
      library_gear_body: "Thematic sets T5→T50. Requirements and stats live on the item. Post-fight wear shows in the header and Inventory (Broken badge, durability bar). Repair is at the Pitch Forge for NV."
      library_quests_title: "Quests"
      library_quests_body: "Board at Coal Hall. Chain: Bait → Tail → Bandage → Healer bag / field kit → shore patrols. Locked contracts open after turn-in; Where on the card hints the route."
      library_hospital_title: "Infirmary and injuries"
      library_hospital_body: "Chip timer only if you wait. Rest/bags/VM scrolls clear injury immediately. Combat trauma is PvP-only with an assault scroll; free rest does not clear it. Header chips: Attack and Heal scroll counts."
      library_pvp_title: "Cell PvP"
      library_pvp_body: "Assault in the nearby list or profile when you share a cell. Needs a combat trauma scroll (Infirmary, VM). Safe zones: infirmary, temple, shop, arena room."
      library_shore_title: "Ashen Shore"
      library_shore_body: "Ticks, scouts, patrol, smuggling, pier ghosts, knifers, dust singers. Extra T5 can go to the Ash Buyer for NV."
      library_obelisk_title: "Obelisk and Bank"
      library_obelisk_body: "Veil Obelisk: bind coordinates and recall for 15 NV (outdoor chip). Pitch Bank: NV vault and one item locker."
      library_alignment_title: "Alignment"
      library_alignment_body: "Law Abode in the Cistern: first pledge free, change costs 25 NV. Current alignment shows on the character sheet."
      library_fatigue_title: "Fatigue"
      library_fatigue_body: "Header chip. At 86%+ movement is blocked. Coal Tide Tavern table clears fatigue with HP/MP."
      library_gather_title: "Gather tools"
      library_gather_body: "Dig needs Coal Hatchet, Look needs Ash Sickle. Fish needs a rod (T1–T4) + the matching hook (наживка) for that fish — not combat Veil Bait. Higher fishing skill + rod tier = faster casts and no slips. Sell fish/hooks at the Ash Buyer."
      library_magic_title: "Mage scrolls"
