      landmark_inside_lead: "Вы внутри:"
      library_aria: "Справочник механик"
      library_title: "Справочник Пепельной Завесы"
      library_lead: "Правила Пепельной Завесы — здесь, в городе."
      library_combat_title: "Бой"
      library_combat_body: "Попадание, уворот, крит и блок зависят от Точности, Уловки, Сокрушения и Стойкости. Крит ×2. Свитки магов дают Угольную Искру / Пепельную Вспышку / Соляное Копьё (мана + стихийное сопротивление)."
      library_bait_title: "Приманка и боты"
      library_bait_body: "Без приманки боты на клетке сами нападают раз в 5 минут. Чтобы вызвать бой раньше (Осмотр / Вход / Персонаж / Инвентарь) — купи или возьми «Приманку Завесы» в лавке."
      library_gear_title: "Снаряжение"
      library_gear_body: "Тематические сеты T5→T50. Требования и статы на предмете. Износ после боёв виден в шапке и в Инвентаре (метка «Сломано», полоска прочности). Починка — в Смоляной Кузнице за NV."
      library_quests_title: "Задания"
      library_quests_body: "Доска в Ратуше Угля. Цепь: Приманка → Хвост → Бинт → Сумка лекаря / полевой набор → береговые дозоры. Закрытые договоры открываются после сдачи; «Где» на карточке подсказывает маршрут."
      library_hospital_title: "Лазарет и травмы"
      library_hospital_body: "Таймер на чипе — только если ждать. Отдых/сумки/свитки VM снимают травму сразу. Боевая травма — только PvP со свитком атаки; свободный отдых её не снимает. В шапке: «Напасть» и «Лечение» — счётчики свитков."
      library_pvp_title: "PvP на клетке"
      library_pvp_body: "«Напасть» в списке рядом или в профиле, если вы на одной клетке. Нужен свиток боевой травмы (Лазарет, VM). Безопасные зоны: лазарет, храм, лавка, комната арены."
      library_shore_title: "Пепельный Берег"
      library_shore_body: "Клещи, разведчики, патруль, контрабанда, призраки пирса, ножевики, пылевые певцы. Лишний T5 можно сдать Скупщику Пепла за NV."
      library_obelisk_title: "Обелиск и Банк"
      library_obelisk_body: "Обелиск Завесы: привязка координат и возврат за 15 NV (чип на улице). Банк Смолы: сейф NV и одна ячейка предмета."
      library_alignment_title: "Склонность"
      library_alignment_body: "Обитель Закона в Цистерне: первое объявление бесплатно, смена 25 NV. На листе персонажа видно текущую склонность."
      library_fatigue_title: "Усталость"
      library_fatigue_body: "Чип в шапке. На 86%+ ход блокируется. Стол в Таверне Угля снимает усталость вместе с HP/MP."
      library_gather_title: "Инструменты добычи"
      library_gather_body: "Копать — Топор Угля, Осмотр — Серп Пепла. Рыбалка — удочка (T1–T4) + своя наживка под рыбу (не боевая Приманка Завесы). Умелка и класс удочки ускоряют заброс и убирают срывы. Сдача рыбы/наживки — Скупщику Пепла."
      library_magic_title: "Свитки магов"
      library_magic_body: "Свитки Угольной Искры / Пепельной Вспышки / Соляного Копья добавляют мана-атаки в бой. Покупка: премиум-стол Лазарета. Урон зависит от точности и стихийного сопротивления."
      library_mail_title: "Почта и Аукцион"
      library_mail_body: "Пепельная Почта: заметка + письмо по имени. Аукцион Соли: выставить/купить лот (общий пул с Торговым хабом)."
      library_sector_title: "Войны крепостей"
      library_sector_body: "Доска в Зале Клана: владельцы и осады. Захват/защита на клетке крепости в окне 14:00–22:00. Здания дают клановые бонусы."
      library_airship_title: "Челноки Разломов"
      library_airship_body: "Площадь ↔ Рынок ↔ Верфь (+ Маяк / Цистерна) и дальние гавани Пепла — Октальная Бухта, Соляной Атолл, Ярмарка Угольной Ямы."
      library_tips_title: "Подсказки «i»"
      library_tips_body: "Маленькие кнопки «i» у маршрутов и Dig/Look/Fish открывают короткую подсказку без похода в справочник."
      library_next: "Дальше отсюда:"
      tavern_rumors_title: "Слухи угля"
      tavern_rumor_forge_title: "Кузница"
      tavern_rumor_forge_body: "«В Смоляной Кузнице Смолокур варит бинты из щепы и хвостов. Навык растёт с каждым крафтом.»"
      tavern_rumor_bait_title: "Приманка"
      tavern_rumor_bait_body: "«Боты сами кидаются раз в пять минут. Хочешь быстрее — купи Приманку Завесы и дерни Осмотр на клетке.»"
      tavern_rumor_west_title: "Западные ворота"
      tavern_rumor_west_body: "«На берегу клещи и разведчики. Из клетки ворот всегда есть вход обратно в город.»"
      tavern_rumor_east_title: "Восточные ворота"
      tavern_rumor_east_body: "«Из Цистерны (район закона) восточный выход тоже ведёт на Пепельный Берег — с другой стороны Пепельного Форта.»"
      tavern_rumor_hall_title: "Ратуша"
      tavern_rumor_hall_body: "«Договоры висят цепью. Сдал — открылось следующее. В шапке чип показывает куда идти.»"
      tavern_rumor_hospital_title: "Лазарет"
      tavern_rumor_hospital_body: "«Бинт и сумки лекаря лечат сразу. Свиток боевой травмы — и Напасть на игрока рядом.»"
      tavern_rumor_east_alt_title: "Восточные ворота"
      tavern_rumor_east_alt_body: "«Через Цистерну — второй выход к берегу. Не застревай: у клетки снова ворота.»"
      tavern_rumor_airship_title: "Дирижабль"
