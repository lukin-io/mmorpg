en:
  devise:
    mailer:
      confirmation_instructions:
        subject: "Confirmation instructions"
        greeting: "Welcome %{email}!"
        instruction: "You can confirm your account email through the link below:"
        action: "Confirm my account"
      reset_password_instructions:
        subject: "Reset password instructions"
        greeting: "Hello %{email}!"
        instruction: "Someone has requested a link to change your password. You can do this through the link below."
        action: "Change my password"
        ignore: "If you didn't request this, please ignore this email."
        until_changed: "Your password won't change until you access the link above and create a new one."
      unlock_instructions:
        subject: "Unlock instructions"
        greeting: "Hello %{email}!"
        instruction: "Your account has been locked due to an excessive number of unsuccessful sign in attempts."
        click: "Click the link below to unlock your account:"
        action: "Unlock my account"
      email_changed:
        subject: "Email Changed"
        greeting: "Hello %{email}!"
        changing: "We're contacting you to notify you that your email is being changed to %{email}."
        changed: "We're contacting you to notify you that your email has been changed to %{email}."
      password_change:
        subject: "Password Changed"
        greeting: "Hello %{email}!"
        changed: "We're contacting you to notify you that your password has been changed."
